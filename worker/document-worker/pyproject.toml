[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eiri-document-worker"
version = "0.1.0"
description = "Isolated PDF text and OCR worker for Eiri Reimbursement Helper"
requires-python = ">=3.12"
dependencies = [
    "onnxruntime==1.29.0",
    "pypdfium2==5.13.0",
    "rapidocr==3.9.2",
    "reportlab==4.4.9",
    "pypdf==6.10.0",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
bundle = [
    "pyinstaller==6.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]
